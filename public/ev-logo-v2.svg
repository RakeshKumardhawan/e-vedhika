<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- కలర్ గ్రేడియంట్స్ (Color Gradients) -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <style>
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .logo-ring {
        transform-origin: center;
        animation: spin 8s linear infinite;
      }
    </style>
  </defs>
  
  <!-- బయటి డైనమిక్ రింగ్ (Outer Dynamic Ring) -->
  <circle
    class="logo-ring"
    cx="32"
    cy="32"
    r="29"
    fill="none"
    stroke="url(#ringG)"
    stroke-width="2.5"
    stroke-dasharray="10 5"
  />
  
  <!-- లోపలి ప్రైమరీ బ్యాక్‌గ్రౌండ్ (Inner Gradient Base) -->
  <circle cx="32" cy="32" r="25" fill="url(#g)" />
  <circle cx="32" cy="32" r="21" fill="#0f172a" />
  
  <!-- EV సెంట్రల్ టెక్స్ట్ (EV Central Text) -->
  <text
    x="50%"
    y="54%"
    dominant-baseline="middle"
    text-anchor="middle"
    fill="#ffffff"
    font-size="18"
    font-weight="900"
    font-family="Segoe UI, system-ui, -apple-system, sans-serif"
    letter-spacing="0.5"
  >
    EV
  </text>
</svg>
