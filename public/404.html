<!DOCTYPE html>
<html lang="te">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ ఈ-వేదిక (E-Vedhika) | Loading...</title>
    <!-- Fallback redirect after 2s if script fails -->
    <meta http-equiv="refresh" content="2;url=/">
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      (function() {
        try {
          var l = window.location;
          // For custom domains (e-vedhika.in), pathSegmentsToKeep is 0.
          // For project pages (username.github.io/repo-name), pathSegmentsToKeep is 1.
          var isCustomDomain = !l.hostname.endsWith('.github.io');
          var pathSegmentsToKeep = isCustomDomain ? 0 : (l.pathname.split('/')[1] ? 1 : 0);

          var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
          var query = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
          var hash = l.hash || '';

          // Save full target path into sessionStorage for instant restoration
          try {
            sessionStorage.setItem('spa_redirect_target', l.pathname + l.search + hash);
          } catch (e) {}

          var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            path +
            query +
            hash;

          l.replace(redirectUrl);
        } catch (err) {
          window.location.replace('/');
        }
      })();
    </script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #0b192c;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        text-align: center;
      }
      .card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 36px 28px;
        max-width: 440px;
        width: 100%;
        backdrop-filter: blur(12px);
      }
      .logo {
        font-size: 32px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 8px;
        color: #fbe947;
      }
      p {
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #fbe947;
        border-radius: 50%;
        animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      a {
        color: #38bdf8;
        text-decoration: none;
        font-size: 12px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">🏛️</div>
      <h1>ఈ-వేదిక (E-Vedhika)</h1>
      <p>పేజీ లోడ్ అవుతోంది, దయచేసి ఒక్క క్షణం వేచి ఉండండి...<br><span style="font-size:11px;opacity:0.8;">Loading requested page, please wait...</span></p>
      <div class="spinner"></div>
      <div>
        <a href="/">హోమ్‌పేజీకి వెళ్లండి (Go to Home)</a>
      </div>
    </div>
  </body>
</html>
